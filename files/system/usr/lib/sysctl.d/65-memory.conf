# Wine/Proton/DXVK memory mapping headroom - prevents "out of memory" crashes
# in modded games (Bazzite 70-gaming.conf value)
vm.max_map_count=2147483642
# Disable kswapd watermark boost (bursty allocations under load) and tighten
# the watermarks so reclaim keeps up under game alloc storms (Bazzite deck)
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125
