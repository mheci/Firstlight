# Gaming compatibility / performance sysctls
# vm.max_map_count raised to the maximum (2^31 - 6) for large-address-space games/tools
vm.max_map_count = 2147483642
# Moderate swappiness (overrides cachyos-settings' 100): zswap-preferring, not aggressive
vm.swappiness = 60
# inotify limits for file watchers (wine, electron, build tooling)
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024