# Controller-friendly Bluetooth tuning (from Bazzite deck): low-latency LE
# connection params, dual-mode controllers, no pairing prompts for controllers.
[General]
AlwaysPairable=true
Privacy=device
ControllerMode=dual
JustWorksRepairing=always

[Policy]
AutoEnable=true

[LE]
MinConnectionInterval=7
MaxConnectionInterval=9
ConnectionLatency=0
