name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
permissions:
  contents: read
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # Checkout manually and skip the action's internal checkout (skip_checkout):
      # the action's checkout resets the workspace from git, which would wipe the
      # gitignored MOK private key injected below.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # MOK signing key for the CachyOS kernel (Secure Boot). base64 PEM in the
      # FIRSTLIGHT_MOK_KEY secret; the files module ships it into the image, and
      # install-kernel-cachyos.sh signs the kernel + modules at build time.
      - name: Inject MOK signing key
        run: |
          if [ -n "${{ secrets.FIRSTLIGHT_MOK_KEY }}" ]; then
            mkdir -p files/system/etc/pki/firstlight-mok
            echo "${{ secrets.FIRSTLIGHT_MOK_KEY }}" | base64 -d > files/system/etc/pki/firstlight-mok/priv.pem
          fi
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@836161eb076426a451e6a0054f722b1153b8b3ad # v1.12.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: "true" # we checkout above so the injected MOK key survives

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
