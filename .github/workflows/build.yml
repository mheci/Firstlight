name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
permissions:
  contents: read
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # Checkout manually and skip the action's internal checkout (skip_checkout):
      # the action's checkout resets the workspace from git, which would wipe any
      # injected gitignored build files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the build is fully handled by the reusable github action.
      # Pinned at 2f3ad44f (post-v1.12.0, 2026-07-30): v1.12.0's cosign-installer pin
      # fails to fetch cosign after Sigstore rotated its release keys ("Fetched public
      # key does not match expected digest"); this commit also adds the
      # cosign_public_key input (not needed here - cosign.pub ships in the repo).
      - name: Build Custom Image
        uses: blue-build/github-action@2f3ad44fe1c1f09d5144f69dc118baee7ca6b008 # v1.12.0+cosign fix
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: "true" # we checkout above

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
