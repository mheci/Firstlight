name: security
on:
  workflow_run:
    workflows: [bluebuild]
    types: [completed]
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scorecard:
    name: OpenSSF Scorecard
    # scorecard-action exits non-zero when error-severity findings exist (cosmetic -
    # the SARIF is still uploaded); don't let that mark the run red.
    continue-on-error: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif

  sbom:
    name: Generate SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: firstlight.sbom.json
          dependency-snapshot: true
          upload-artifact: true

  imagescan:
    name: Image SBOM + vulnerability scan (syft + grype)
    # scan the built image after a successful build; also on schedule/dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/mheci/firstlight:latest
          format: cyclonedx-json
          output-file: firstlight.image.sbom.json
          upload-artifact: true
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ghcr.io/mheci/firstlight:latest
          severity-cutoff: high
          fail-build: false
          only-fixed: true
          cache-db: true
          output-format: sarif
          sarif: results.sarif
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
