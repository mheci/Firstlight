---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: firstlight
# description will be included in the image's metadata
description: My personal Fedora Kinoite image with NVIDIA open drivers and CUDA, optimized for KDE Plasma 6, built with BlueBuild.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: "44" # pinned to Fedora 44 to match the fedora44 NVIDIA repos and avoid future breakage

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # minimal Plasma: strip stock Kinoite bloat that has no place on a focused gaming/creative
  # desktop (PIM daemons, remote desktop, first-run wizards, CJK input stack blue-build adds).
  # auto-remove is off: never cascade-remove something a wanted package happens to depend on.
  - type: dnf
    remove:
      auto-remove: false
      packages:
        - akonadi-server
        - akonadi-server-mysql
        - audiocd-kio
        - filelight
        - kcharselect
        - kde-connect
        - kde-partitionmanager
        - kdenetwork-filesharing
        - kfind
        - khelpcenter
        - kio-gdrive
        - kjournald
        - kmenuedit
        - krdp
        - krfb
        - kwalletmanager5
        - kwrite
        - plasma-disks
        - plasma-drkonqi
        - plasma-thunderbolt
        - plasma-vault
        - plasma-welcome
        - samba-usershares
        - thermald
        - kamera
        - kaccounts-integration-qt6
        - kaccounts-providers
        - kdebugsettings
        - kdnssd
        - kunifiedpush
        - plasma-setup
        - plasma-desktop-doc
        - fcitx5
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt
        - kcm-fcitx5

  - type: dnf
    repos:
      copr:
        - imput/helium
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://developer.download.nvidia.com/compute/cuda/repos/fedora44/x86_64/cuda-fedora44.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        - https://developer.download.nvidia.com/compute/cuda/repos/fedora44/x86_64/73CD9B30.pub
    install:
      packages:
        - brave-origin
        - helium-bin
        # kernel headers/devel for the stock kernel; required by NVIDIA DKMS builds
        # (the CachyOS kernel + devel install in install-kernel-cachyos.sh - its scriptlet
        # order breaks the dnf module, and the DKMS kmod must build after it)
        - kernel-devel-matched
        - kernel-headers
        # NVIDIA driver userspace + CUDA (the open kernel modules kmod-nvidia-open-dkms
        # install in install-kernel-cachyos.sh so DKMS builds for the CachyOS kernel too)
        - nvidia-driver
        - cuda-toolkit
        - gcc
        - gcc-c++
        # OpenCL loader + Khronos headers (NVIDIA's ICD ships with the driver)
        - ocl-icd
        - opencl-headers
        # NVIDIA utilities (nvidia-smi ships inside nvidia-driver)
        - nvidia-settings
        - nvidia-persistenced
        - nvidia-modprobe
        - nvidia-xconfig
        # monitoring
        - nvtop
        - btop
        # media and runtimes
        - nodejs # includes npm; yt-dlp comes from Fedora (stable, replaces Terra's yt-dlp-git)

  - type: script
    scripts:
      - install-kernel-cachyos.sh # CachyOS kernel (noscripts + depmod), NVIDIA DKMS kmod
      - install-secureboot.sh # machine-local Secure Boot signing + MOK enrollment (firstlight-sb-sign service)
      - install-latest-tools.sh # bun + pi via bun (Terra's pi RPM is broken; opencode comes from Terra)
      - enable-terra.sh # Terra repo + mesa/extras subrepos bootstrap, priority=1
      - swap-mesa-terra.sh # mesa downgraded to Terra's build
      - enable-terra-multimedia.sh # fdk-aac (32-bit for steam), ffmpeg, gstreamer libav plugin
      - dnf-terra-apps.sh # ejs, deno + Terra apps (lact/uupd/vicinae/t3code/opencode/starship/bottom) + terra-gamescope
      - install-scx-schedulers.sh # scx-scheds + scx-tools (stable, Terra) + scx-manager (CachyOS addons COPR) + all-16-scheduler perf config
      - enable-rpmfusion.sh # RPM Fusion repos only (fallback)
      - dnf-fedora-extras.sh # kitty, fastfetch, zsh, gstreamer stack, fonts, yt-dlp, mpv, lollypop, rust utils, input-remapper, ddcutil, i2c-tools, obs-studio (+distroav), sync/creative tools
      - install-greenboot.sh # boot health checks + auto rollback (greenboot-rs, Fedora)
      - install-waterfox.sh # Waterfox browser (official BrowserWorks OBS repo, rpm)
      - install-llama-cpp.sh # llama.cpp with CUDA backend, prebuilt conda-forge binaries
      - install-whisper-cpp.sh # whisper.cpp v1.9.2 (official prebuilt release tarball, no source build)
      - install-kde-plasma.sh # KDE Plasma: Klassy/Darkly/bibata/breeze-plus/fluent themes + Vapor (bazzite COPR), kwin scripts enable, Plasma defaults
      - selinux-gaming.sh # SELinux booleans for Proton/Wine (execmod/execstack/execheap) via boot unit
      - install-open-webui.sh # Open WebUI (quadlet container) as llama.cpp frontend
      - install-glance.sh # Glance dashboard (systemd service)
      - install-noise-suppression.sh # RNNoise mic denoising (werman LADSPA, stereo) via pipewire filter-chain
      - install-cachyos-settings.sh # CachyOS tuned sysctls/udev/systemd (zram disabled - zswap preferred) + power-profiles-daemon
      - install-game-performance.sh # game-performance wrapper (perf profile + scx Gaming mode) + pci-latency service
      - install-env-tweaks.sh # NVIDIA/GL/Qt shader caches + nvidia GLX vendor, system-wide via /etc/environment (coredumps disabled via files module)
      - install-ntsync.sh # autoload ntsync module - /dev/ntsync is world-rw (0666) once loaded
      - install-wl-clip-persist.sh # clipboard survives app exit (COPR prebuilt 0.4.1, no source build) + autostart
      - install-just.sh # just command runner (Fedora rust-just)
      - install-handlr-regex.sh # handlr-regex default-app handler (release binary)
      - install-ab-download-manager.sh # AB Download Manager (third-party COPR, 1.10.1)
      - install-proton-cachyos.sh # Proton-CachyOS Steam compat tool (baked tarball + per-user installer)
      - install-flameget.sh # FlameGet download manager (native from source, no Flatpak)
      - install-betterbird.sh # Betterbird mail client (native tarball to /opt, no Flatpak)
      - install-hermes.sh # Hermes Agent (Nous Research) AI agent CLI
      - install-blackbird.sh # blackbird OSINT CLI (venv in /opt/blackbird)
      - install-unsloth-desktop.sh # Unsloth Desktop (extracted from .deb, no rpm exists)

  - type: kargs
    kargs:
      - rd.driver.blacklist=nouveau
      - modprobe.blacklist=nouveau
      - nvidia-drm.modeset=1
      - nvidia-drm.fbdev=1

  - type: signing # this sets up the proper policy & signing files for signed images to work fully